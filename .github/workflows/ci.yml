name: HERMES backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run backend smoke tests
        env:
          HERMES_TENANT_ID: hermes-ci
          HERMES_SESSION_SECRET: ci-only-secret-not-for-production
          HERMES_ADMIN_USER: ci-admin
          HERMES_ADMIN_PASSWORD: ci-test-password
          HERMES_COOKIE_SECURE: "false"
          DATABASE_URL: sqlite:///./hermes-ci-test.db
        run: pytest -q tests
