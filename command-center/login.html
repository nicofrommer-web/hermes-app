<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101112"><title>HERMES · Anmeldung</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0f10;color:#f1f1ed;font:15px/1.5 Inter,system-ui,sans-serif;padding:20px}.panel{width:min(420px,100%);background:#151819;border:1px solid #292f30;border-radius:18px;padding:30px;box-shadow:0 24px 80px #0007}.brand{font-size:12px;letter-spacing:.2em;color:#d5ad70;font-weight:700}.panel h1{font-size:26px;margin:12px 0 4px}.muted{color:#9aa09d;margin:0 0 24px}.field{display:block;width:100%;margin:7px 0 16px;padding:13px;border:1px solid #394041;border-radius:9px;background:#101314;color:#fff}.btn{width:100%;border:0;border-radius:9px;padding:13px;background:#d5ad70;color:#151515;font-weight:700;cursor:pointer}.error{color:#e18a82;min-height:22px;margin-top:12px;font-size:13px}label{font-size:13px;color:#c5c9c6}
</style></head><body><main class="panel"><div class="brand">H E R M E S</div><h1>Command Center</h1><p class="muted">Melde dich an, um deinen geschützten Arbeitsbereich zu öffnen.</p>
<form id="login"><label for="username">Benutzername</label><input class="field" id="username" name="username" autocomplete="username" required maxlength="120"><label for="password">Passwort</label><input class="field" id="password" name="password" type="password" autocomplete="current-password" required maxlength="500"><button class="btn" type="submit">Sicher anmelden</button><div class="error" id="error" role="alert"></div></form></main>
<script>
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';const button=e.currentTarget.querySelector('button');button.disabled=true;try{const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Anmeldung fehlgeschlagen');location.href='/'}catch(err){error.textContent=err.message}finally{button.disabled=false}});
</script></body></html>
